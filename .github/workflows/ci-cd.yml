name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests python 3.14 on every platform, the older
        # and newer versions are tested locally with `tox run-parallel`, see
        # docs/development.md
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        # a release run restores no cache, which zizmor cannot tell from the
        # expression; the distributions are built without one, see `release`
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    - name: Test with tox
      env:
        TOX_ENV: py${{ matrix.python-version }}
        # the snippets of the documentation and the example scripts run on linux
        # only, they start an interpreter each and test no platform specific code
        MARKERS: ${{ runner.os != 'Linux' && 'not docs and not examples' || '' }}
      # the slowest tests are listed in the log, so that they stay visible
      run: uvx --with tox-uv tox -e "${TOX_ENV}" -- --durations=15 -m "${MARKERS}"
      shell: bash

  engines:
    # the differential gate: every batch the rust kernel analyses is analysed
    # by the python core as well and the two answers are compared, names,
    # order, NaN positions, numbers and units (pkpdutils.nca.engine, armed by
    # PKPDUTILS_COMPARE_ENGINES). One platform is enough, the two engines
    # compute the same numbers everywhere; the documentation snippets and the
    # examples are left out, they start an interpreter each and build no batch
    # the suite does not
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # the one place this job names the variable: both steps below inherit it,
    # so the step which checks the arming and the step which runs the armed
    # suite cannot be given different names. Named twice, a misspelling of the
    # suite's copy alone would leave the check passing and the suite unarmed,
    # where the conftest reads nothing and says nothing
    env:
      PKPDUTILS_COMPARE_ENGINES: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        # a release run restores no cache, which zizmor cannot tell from the
        # expression; the distributions are built without one, see `release`
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
        cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    # the suite itself fails when it is armed and compares nothing
    # (tests/conftest.py), which covers a gate that stops being reached and a
    # variable the library renamed. It cannot cover the variable not arriving
    # at all, since a test process which never sees it cannot know it was
    # meant to be armed: this step is that half, outside pytest and through
    # the same tox environment, so a `passenv` which stops forwarding it fails
    # the job instead of turning it into a second copy of `test`
    - name: The differential gate is armed inside the test environment
      run: >
        uvx --with tox-uv tox exec -e py3.14 -- python -c
        "import sys; from pkpdutils.nca import engine;
        sys.exit(0 if engine.comparing() else 1)"
    - name: Compare the two engines on every batch of the suite
      run: uvx --with tox-uv tox -e py3.14 -- -m "not docs and not examples"

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not, see .github/rulesets/
    name: tests
    needs: [test, engines]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix and of the differential gate
      env:
        RESULT: ${{ needs.test.result }}
        # the gate is required rather than advisory: a job which is not a
        # required check is a job a merge can ignore, and a gate nobody has to
        # pass is a gate which is believed and does not hold
        GATE: ${{ needs.engines.result }}
      run: |
        echo "test matrix: $RESULT"
        echo "differential gate: $GATE"
        test "$RESULT" = "success"
        test "$GATE" = "success"

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/pkpdutils
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        # a release is built from a clean state, never from a restored cache
        enable-cache: false
    - name: Build package
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
