[tox]
envlist = ty, py3.{14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
passenv =
    # the differential gate of the two engines, see pkpdutils.nca.engine; the
    # `engines` job of .github/workflows/ci-cd.yml runs the suite with it set
    PKPDUTILS_COMPARE_ENGINES
deps =
    pytest
    pytest-xdist
# what follows `--` is passed to pytest, e.g. `tox r -e py3.14 -- --durations=15`
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
    # the oracle of `tests/test_quantiles.py` and of `scripts/reference_t_isf.py`.
    # Without it here `mpmath` is unresolvable to ty in this environment and
    # resolvable in a development one, which carries it as a dev extra, and no
    # single `ty: ignore` can be both used and unused: the check has to see the
    # dependencies the project declares
    mpmath
commands =
    ty check
