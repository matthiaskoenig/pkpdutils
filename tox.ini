[tox]
envlist = ty, py3.{13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
passenv =
    # the differential gate of the two engines, see pkpdutils.nca.engine; the
    # `engines` job of .github/workflows/ci-cd.yml runs the suite with it set
    PKPDUTILS_COMPARE_ENGINES
deps =
    pytest
    pytest-xdist
# what follows `--` is passed to pytest, e.g. `tox r -e py3.14 -- --durations=15`
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
