[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkpdutils"
dynamic = ["version"]
description = "pkpdutils are python utilities for the pharmacokinetic and pharmacodynamic analysis of timecourses and parameters."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "pharmacokinetics",
    "pharmacodynamics",
    "non-compartmental analysis",
    "bioequivalence",
    "drug-drug interaction",
    "meta-analysis",
]
dependencies = [
    # the rust kernel of the non-compartmental analysis, which `pkpdutils.nca`
    # sends an eligible batch to (`pkpdutils.nca.engine`). The cap is part of
    # the contract and not caution: the host resolves a unit expression for
    # every column the kernel reports, so one new parameter of a future release
    # raises for every eligible batch. It is lifted by the pull request which
    # raises the floor to that release, see docs/development.md#kernel-floor
    "pkpdutils-core>=0.7.0,<0.8",
    # numerics, data structures and units
    "numpy>=2.2.2",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
    "xarray>=2025.1.0",
    "pint>=0.25.3",
    "pydantic>=2.10.0",
    # figures: the chart builder `sbmlsim_core.chart` and its renderer, which
    # draw every figure of `pkpdutils.plot` (0.34.0 carries the chart builder;
    # sbmlsim depends on pkpdutils, so the figures cannot use sbmlsim itself)
    "sbmlsim-core>=0.37.0",
    # console output
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.5.1",
    "ruff>=0.16.6",
    "pre-commit>=4.6.2",
    "ty>=0.0.104",
    # 4.67.5 refuses its package staging directory when it was created under
    # umask 002, tox-dev/tox#4357
    "tox>=4.61.2,!=4.67.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "zensical>=0.0.60",
    "mkdocstrings-python>=2.0.8",
    # the 40 digit reference of the quantiles: `tests/test_quantiles.py` and
    # `scripts/reference_t_isf.py` compute the expected values with it
    "mpmath>=1.3.0",
]

[project.urls]
Homepage = "https://matthiaskoenig.github.io/pkpdutils"
Documentation = "https://matthiaskoenig.github.io/pkpdutils"
Repository = "https://github.com/matthiaskoenig/pkpdutils"
Issues = "https://github.com/matthiaskoenig/pkpdutils/issues"
Changelog = "https://github.com/matthiaskoenig/pkpdutils/tree/develop/release-notes"
Download = "https://pypi.org/project/pkpdutils"

[tool.hatch.version]
path = "./src/pkpdutils/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pkpdutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist), `pytest -n 0` runs them in one process
addopts = "-n auto"
# the tests which run the documentation and the examples in a subprocess each;
# continuous integration runs them on linux only, see docs/development.md
markers = [
    "docs: runs the python snippets of a page of `docs/`",
    "examples: runs an example script of `examples/`",
    "engine_fallback: makes the rust kernel refuse a batch on purpose, see tests/conftest.py",
]

[tool.ty.environment]
# the package lives in the src layout, the examples are a package at the root of
# the repository; the checked python version is inferred from
# `project.requires-python` (i.e. the oldest supported version)
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
