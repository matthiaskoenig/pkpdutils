[project]
site_name = "pkpdutils"
site_url = "https://matthiaskoenig.github.io/pkpdutils/"
site_description = "Pharmacokinetic and pharmacodynamic analysis of timecourses and parameters: non-compartmental analysis, curve fitting, uncertainty, significance tests, bioequivalence, drug-drug interactions and meta-analysis"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2018-2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/pkpdutils"
repo_name = "matthiaskoenig/pkpdutils"
edit_uri = "edit/develop/docs/"

# the card grid of the gallery, see `docs/stylesheets/extra.css`
extra_css = [
  "stylesheets/extra.css",
]

# MathJax for the formulas of the user guide (pymdownx.arithmatex)
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Workflows" = "workflows.md" },
  { "User guide" = [
    { "Timecourses" = "timecourses.md" },
    { "Data formats" = "formats.md" },
    { "Non-compartmental analysis" = "nca.md" },
    { "Uncertainty" = "uncertainty.md" },
    { "Curve fitting" = "fitting.md" },
    { "Pharmacodynamics" = "pd.md" },
    { "Statistics" = "statistics.md" },
    { "Bioequivalence" = "bioequivalence.md" },
    { "Drug-drug interactions" = "ddi.md" },
    { "Plotting" = "plotting.md" },
    { "Units" = "units.md" },
    { "Gallery" = "gallery.md" },
    { "Glossary" = "glossary.md" },
  ] },
  { "References" = "references.md" },
  { "API reference" = [
    { "Overview" = "api/index.md" },
    { "pkpdutils" = [
      { "units" = "api/units.md" },
      { "timecourse" = "api/timecourse.md" },
      { "result" = "api/result.md" },
      { "io" = "api/io.md" },
      { "parallel" = "api/parallel.md" },
      { "console" = "api/console.md" },
      { "log" = "api/log.md" },
    ] },
    { "pkpdutils.nca" = [
      { "nca" = "api/nca.md" },
      { "options" = "api/nca.options.md" },
      { "result" = "api/nca.result.md" },
      { "auc" = "api/nca.auc.md" },
      { "terminal" = "api/nca.terminal.md" },
      { "intervals" = "api/nca.intervals.md" },
      { "steady_state" = "api/nca.steady_state.md" },
      { "uncertainty" = "api/nca.uncertainty.md" },
    ] },
    { "pkpdutils.fit" = [
      { "fit" = "api/fit.md" },
      { "models" = "api/fit.models.md" },
      { "compare" = "api/fit.compare.md" },
      { "proportionality" = "api/fit.proportionality.md" },
    ] },
    { "pkpdutils.stats" = [
      { "stats" = "api/stats.md" },
      { "bioequivalence" = "api/stats.bioequivalence.md" },
      { "ddi" = "api/stats.ddi.md" },
      { "meta" = "api/stats.meta.md" },
    ] },
    { "pkpdutils.plot" = [
      { "plot" = "api/plot.md" },
    ] },
  ] },
  { "Contributing" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/pkpdutils"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pkpdutils/"

# API reference is rendered from the docstrings, see the `docs/api` pages
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# the ```mermaid fences of the diagrams of the user guide, rendered in the browser
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
